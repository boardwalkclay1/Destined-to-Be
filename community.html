<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community – Destined to Be</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/community/community.js"></script>
</head>

<body class="app-body">

  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="icon-btn" title="Back">←</a>
      <h2>Community</h2>
    </div>
    <span class="subhead topbar-right">Connect &amp; Share</span>
  </header>

  <main class="content">

    <!-- COMPOSER -->
    <section class="card">
      <h3>Share a Reading, Concept, or Insight</h3>

      <div class="composer-tabs" role="tablist">
        <button class="composer-tab active" data-tab="text" role="tab">✍ Text</button>
        <button class="composer-tab" data-tab="photo" role="tab">📷 Photo</button>
        <button class="composer-tab" data-tab="reading" role="tab">🔮 Reading</button>
      </div>

      <!-- Text post -->
      <div id="tab-text" class="composer-panel active">
        <textarea id="post-text" class="bubble-input" rows="4"
          placeholder="Share a concept, experience, or numerology insight…"
          style="border-radius:14px;resize:vertical;"></textarea>
        <div class="composer-actions">
          <label class="post-type-label">
            <span>Category</span>
            <select id="post-category" class="bubble-select" style="border-radius:14px;width:auto;">
              <option value="insight">Insight</option>
              <option value="question">Question</option>
              <option value="numerology">Numerology</option>
              <option value="tarot">Tarot</option>
              <option value="astrology">Astrology</option>
              <option value="dream">Dream</option>
              <option value="synchronicity">Synchronicity</option>
            </select>
          </label>
          <button id="post-text-btn" class="primary-btn">Post</button>
        </div>
      </div>

      <!-- Photo post -->
      <div id="tab-photo" class="composer-panel" style="display:none;">
        <div class="photo-upload-area" id="photo-drop-zone">
          <span id="photo-drop-label">📷 Drag a photo / video here, or use the button below</span>
          <img id="photo-preview" style="display:none;max-width:100%;border-radius:10px;margin-top:8px;" alt="">
          <video id="video-preview" style="display:none;max-width:100%;border-radius:10px;margin-top:8px;" controls></video>
        </div>
        <label class="file-label" style="display:block;margin-top:8px;">
          <span style="display:none;">Select photo or video</span>
          <input type="file" id="photo-input" accept="image/*,video/*" aria-label="Select photo or video to share">
        </label>
        <textarea id="photo-caption" class="bubble-input" rows="2"
          placeholder="Add a caption…"
          style="border-radius:14px;resize:vertical;margin-top:8px;"></textarea>
        <button id="post-photo-btn" class="primary-btn" style="margin-top:8px;width:100%;">Share Photo / Video</button>
      </div>

      <!-- Reading post (pull from tarot) -->
      <div id="tab-reading" class="composer-panel" style="display:none;">
        <p style="color:var(--text-muted);font-size:13px;">Share a tarot or numerology reading you received.</p>
        <textarea id="reading-text" class="bubble-input" rows="5"
          placeholder="Paste or type your reading here…"
          style="border-radius:14px;resize:vertical;"></textarea>
        <button id="post-reading-btn" class="primary-btn" style="margin-top:8px;width:100%;">Share Reading</button>
      </div>
    </section>

    <!-- SEARCH / FILTER -->
    <section class="card" style="padding:12px 16px;">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input id="feed-search" class="bubble-input" placeholder="🔍 Search posts…"
          style="flex:1;min-width:120px;border-radius:999px;margin:0;">
        <select id="feed-filter" class="bubble-select" style="border-radius:999px;width:auto;">
          <option value="all">All</option>
          <option value="insight">Insights</option>
          <option value="tarot">Tarot</option>
          <option value="numerology">Numerology</option>
          <option value="astrology">Astrology</option>
          <option value="question">Questions</option>
          <option value="dream">Dreams</option>
          <option value="synchronicity">Synchronicities</option>
          <option value="photo">Photos</option>
        </select>
      </div>
    </section>

    <!-- COMMUNITY FEED -->
    <section class="card">
      <h3>Community Feed</h3>
      <div id="community-feed" class="community-feed">
        <p class="empty-feed-msg" style="color:var(--text-muted);text-align:center;padding:20px 0;">
          No posts yet. Be the first to share! ✦
        </p>
      </div>
    </section>

    <!-- MEMBERS ONLINE -->
    <section class="card">
      <h3>Active Members</h3>
      <div id="members-list" class="members-list">
        <p style="color:var(--text-muted);font-size:13px;">Members who have posted recently will appear here.</p>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer-nav">
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="location.href='number.html'">Numbers</button>
    <button onclick="location.href='tarot.html'">Tarot</button>
    <button onclick="location.href='community.html'" class="active">Community</button>
    <button onclick="location.href='settings.html'">Settings</button>
  </footer>

</body>
</html>
