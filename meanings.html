<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meanings – Destined to Be</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icon-192.png">

  <!-- Global styles -->
  <link rel="stylesheet" href="styles/styles.css">

  <!-- Meanings logic -->
  <script type="module" src="js/meanings/meanings.js"></script>
</head>

<!-- PAGE IDENTIFIER FOR BACKGROUND -->
<body class="app-body" data-page="meanings">

  <!-- PAGE FLIP INTRO -->
  <div id="pageflip-sequence"></div>

  <header class="topbar">
    <h2>Numerology Meanings</h2>
    <a href="dev-tools.html" class="icon-btn">🛠</a>
  </header>

  <main class="content">
    <section class="card">
      <h3>Meaning Keys</h3>
      <p class="tip">Click a key to load or create a new one below.</p>
      <ul id="meaning-keys"></ul>
    </section>

    <section class="card">
      <h3>Meaning Editor</h3>

      <label for="meaning-key-input">Key</label>
      <input id="meaning-key-input" type="text" placeholder="e.g. life_path_1, destiny_7">

      <textarea id="meaning-editor" rows="16" placeholder="Write or edit the meaning for this key..."></textarea>

      <button id="save-meaning" class="primary-btn">Save Meaning</button>
    </section>
  </main>

  <!-- UI REVEAL AFTER FLIP -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => document.body.classList.add("ui-ready"), 2200);
    });
  </script>

</body>
</html>
